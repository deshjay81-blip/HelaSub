plugins {
    id 'com.android.application'
}

android {
    namespace 'com.helasub.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.helasub.app"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0" // 🔥 Double quotes වලින් නිවැරදි කළා
}
