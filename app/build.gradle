plugins { id 'com.android.application' }

android {
    namespace 'com.helasub.app'
    compileSdk 35 // 🔥 Android 15 සඳහා 35 දක්වා වැඩි කළා

    defaultConfig {
        applicationId "com.helasub.app"
        minSdk 21       // Android 5.0 සහ ඉහළ සියලුම TV/Phones සඳහා
        targetSdk 35    // 🔥 Play Protect Warning එක නැති කිරීමට 35 කළා
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0' // 🔥 Libraries ද අලුත්ම ඒවාට Update කළා
}
